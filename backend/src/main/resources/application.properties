spring.application.name=backend
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=42MB
server.port=${PORT:8085}

# Provider-neutral deployment health checks. Only status is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/satrk?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development keeps the existing automatic schema update workflow.
# Production overrides this with Flyway + Hibernate validation.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.flyway.enabled=false

nexon.api.key=${NEXON_API_KEY}
nexon.api.base-url=${NEXON_API_BASE_URL:https://open.api.nexon.com}
nexon.api.min-request-interval-ms=${NEXON_MIN_REQUEST_INTERVAL_MS:350}

openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.api.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

satrk.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

satrk.security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
satrk.security.rate-limit.login-max-requests=${SECURITY_LOGIN_MAX_REQUESTS:10}
satrk.security.rate-limit.login-window=${SECURITY_LOGIN_WINDOW:15m}
satrk.security.rate-limit.registration-max-requests=${SECURITY_REGISTRATION_MAX_REQUESTS:5}
satrk.security.rate-limit.registration-window=${SECURITY_REGISTRATION_WINDOW:1h}
satrk.security.rate-limit.account-email-max-requests=${SECURITY_ACCOUNT_EMAIL_MAX_REQUESTS:10}
satrk.security.rate-limit.account-email-window=${SECURITY_ACCOUNT_EMAIL_WINDOW:1h}
satrk.security.rate-limit.ai-analysis-max-requests=${SECURITY_AI_MAX_REQUESTS:10}
satrk.security.rate-limit.ai-analysis-window=${SECURITY_AI_WINDOW:1h}
satrk.security.rate-limit.public-lookup-max-requests=${SECURITY_LOOKUP_MAX_REQUESTS:120}
satrk.security.rate-limit.public-lookup-window=${SECURITY_LOOKUP_WINDOW:1m}

satrk.mail.enabled=${MAIL_ENABLED:false}
satrk.mail.from=${MAIL_FROM:}
satrk.mail.reply-to=${MAIL_REPLY_TO:}
satrk.mail.brevo-api-key=${BREVO_API_KEY:}
satrk.mail.brevo-api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
satrk.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
satrk.mail.daily-limit=${MAIL_DAILY_LIMIT:500}
satrk.mail.zone-id=${MAIL_TIME_ZONE:Asia/Seoul}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

satrk.clan-test.enabled=${CLAN_TEST_ENABLED:false}
satrk.clan-test.user-name=${CLAN_TEST_USER_NAME:}
satrk.clan-test.clan-name=${CLAN_TEST_CLAN_NAME:}

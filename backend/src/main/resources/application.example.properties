spring.application.name=backend
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=42MB
server.port=8085

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/satrk?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

nexon.api.key=${NEXON_API_KEY}
nexon.api.base-url=${NEXON_API_BASE_URL:https://open.api.nexon.com}
nexon.api.min-request-interval-ms=${NEXON_MIN_REQUEST_INTERVAL_MS:350}

# Account email delivery. Keep disabled locally until valid SMTP credentials exist.
satrk.mail.enabled=${MAIL_ENABLED:false}
satrk.mail.from=${MAIL_FROM:}
satrk.mail.reply-to=${MAIL_REPLY_TO:}
satrk.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
satrk.mail.daily-limit=${MAIL_DAILY_LIMIT:500}
satrk.mail.zone-id=${MAIL_TIME_ZONE:Asia/Seoul}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Local-only clan recognition override for team-builder testing. Keep disabled in production.
satrk.clan-test.enabled=${CLAN_TEST_ENABLED:false}
satrk.clan-test.user-name=${CLAN_TEST_USER_NAME:}
satrk.clan-test.clan-name=${CLAN_TEST_CLAN_NAME:}

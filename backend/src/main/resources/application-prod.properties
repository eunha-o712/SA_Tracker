server.port=${PORT:8085}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# Flyway owns production schema changes. Hibernate only verifies entity/schema compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=SA-TRACKER existing schema baseline

nexon.api.key=${NEXON_API_KEY}
openai.api.key=${OPENAI_API_KEY}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

satrk.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}
satrk.mail.enabled=${MAIL_ENABLED:true}
satrk.mail.from=${MAIL_FROM}
satrk.mail.reply-to=${MAIL_REPLY_TO}
satrk.mail.frontend-base-url=${FRONTEND_BASE_URL}

spring.mail.host=${SMTP_HOST}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

# Test-only clan overrides must never be active in production.
satrk.clan-test.enabled=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
